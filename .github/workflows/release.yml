name: release
on:
  push:
    tags: ['v*']
permissions: {}
# One run per tag at a time: a run waits for the one before it (GitHub keeps one waiting run, the
# latest).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Builds and tests with a read-only token: no repository code runs where a release can be
  # written or a provenance signed.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The tag is a commit of main and names the top CHANGELOG.md entry, dated: the version the
      # Makefile builds. The asset is named for the runner's architecture, which builds it.
      - name: tag matches main and CHANGELOG.md
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
          v="$(make -s -f Makefile -f - print-version <<<'print-version: ; @echo $(VERSION)')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, CHANGELOG.md's top entry $v"; exit 1; }
          awk -v h="## [$v] - " 'index($0, h) == 1 && substr($0, length(h) + 1) ~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$/ {found = 1} END {exit !found}' CHANGELOG.md || { echo "CHANGELOG.md's $v entry has no date"; exit 1; }
          [ "$(uname -m)" = x86_64 ] || { echo "the runner is $(uname -m), the asset linux-amd64"; exit 1; }
      - run: make check
      - run: make build
      # The asset is the binary this build made, set aside before anything else runs from bin/, and
      # its SBOM (SPDX, by the syft every release's SBOMs are made with: internal/sbom's pin), both
      # in the signed checksums. The notes are the tag's own entry, up to the next entry or a link
      # definition.
      - name: assets and notes
        run: |
          mkdir dist
          cp bin/stowage dist/stowage-linux-amd64
          docker run --rm --mount "type=bind,src=$PWD/dist,dst=/d,readonly" \
            docker.io/anchore/syft:v1.55.0@sha256:4cc92b64ca74ffca4c94d4c8fcc01f217731375300be14d0b6eeb2e82eaa110a \
            file:/d/stowage-linux-amd64 -o spdx-json -q > dist/stowage-linux-amd64.spdx.json
          jq -e '.spdxVersion and (.packages | map(.name) | index("github.com/norvexlabs/stowage"))' dist/stowage-linux-amd64.spdx.json >/dev/null ||
            { echo "the SBOM does not name stowage's module"; exit 1; }
          (cd dist && sha256sum stowage-linux-amd64 stowage-linux-amd64.spdx.json > SHA256SUMS)
          awk -v h="## [${GITHUB_REF_NAME#v}] - " 'index($0, h) == 1 {on = 1; next} on && (/^## \[/ || /^\[[^]]+\]: /) {exit} on' CHANGELOG.md > dist/notes.md
          grep -q . dist/notes.md || { echo "no notes for $GITHUB_REF_NAME"; exit 1; }
      # Uploaded before anything else of the repository runs: what lint runs cannot change it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
      - name: lint the examples with the asset
        run: for e in minimal full stateless; do ./dist/stowage-linux-amd64 -C "examples/$e" lint; done

  # Signs and publishes what the build made; it checks out and runs nothing of the repository.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write     # the release and its assets
      id-token: write     # the signing identity of the checksums' signature and the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # The checksums are signed keyless, on every repository: the certificate names this workflow
      # and the tag, and the signature is recorded in Sigstore's public transparency log.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2
      - name: sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      # GitHub's attestations need a public repository (or Enterprise): a private one skips them.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/stowage-linux-amd64
      # A draft first, its notes and assets replaced on a re-run, published last: a failed run is
      # run again. A published release is never changed; a failed listing stops the run.
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Stowage ${GITHUB_REF_NAME#v}"
          drafts="$(gh api --paginate "repos/$GH_REPO/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .draft")"
          case "$drafts" in
            "") gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$title" --notes-file dist/notes.md ;;
            true) gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file dist/notes.md ;;
            *) echo "release $GITHUB_REF_NAME: already published, or more than one ($drafts)"; exit 1 ;;
          esac
          gh release upload "$GITHUB_REF_NAME" dist/stowage-linux-amd64 dist/stowage-linux-amd64.spdx.json dist/SHA256SUMS dist/SHA256SUMS.sigstore.json --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

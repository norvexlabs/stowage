# A stateless app without a front: one pulled image, nothing built, no database (so no
# schema_compat, data.reset or reset-db, and a backup of its volume alone), and no front: its one
# L4 route publishes the server's port as it is, the stack's only way in.
apiVersion: stowage/v1
name: lookup

stowage:
  requires: ">=0.1 <1"

version:
  source: { provider: changelog, file: CHANGELOG.md }
  scheme: { provider: semver }
changelog: { provider: keepachangelog, file: CHANGELOG.md }
channels:
  stable: { tag: "v{v}", mutable: false, latest: true }
  dev:    { tag: "dev-{v}", mutable: true }                   # a suffix would collide with SemVer pre-releases

registry:
  prefix: registry.example.com/acme
  pull: { provider: none }                                     # public images
  push: { provider: token, user: publisher, token_env: STOWAGE_PUSH_TOKEN }

images:
  server: { ref: "busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec" }

stack:
  compose: deploy/compose.yaml

l4:
  routes:
    - { name: lookup, protocol: tcp, port: 8090, upstream: server:8080 }

health:
  provider: http-status
  service: server
  port: 8080
  path: /health
  expect: 200

data:
  volumes:
    state: { uid: 1000 }                                       # the server's user; busybox has no /state

backup: { provider: volumes-age-rclone, volumes: [state] }    # no database: the volume, with a manifest

inputs:
  - { key: GREETING, prompt: "What the lookup page says", default: "hello" }

shapes:
  docker: {}
  kubernetes: { chart: deploy/chart }                          # no postgres_modes: no database

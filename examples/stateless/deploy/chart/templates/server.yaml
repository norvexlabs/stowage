# The server, and a NodePort Service for each of the release's L4 routes (stowage.l4) to the
# server, which their upstreams name.
{{- $img := index .Values.stowage.images "server" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.stowage.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      {{- with .Values.stowage.sysctls }}
      securityContext:
        sysctls:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: server
          image: {{ printf "%s/%s@%s" .Values.stowage.registry $img.repository $img.digest }}
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/health && echo \"$GREETING\" > /www/index.html && exec httpd -f -p 8080 -h /www"]
          env:
            - name: GREETING
              valueFrom:
                secretKeyRef: { name: {{ required "stowage.secret: install with lookup-stow k8s" .Values.stowage.secret | quote }}, key: GREETING }
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
{{- range .Values.stowage.l4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-l4-{{ .name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: {{ .service }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - { name: {{ .name }}, protocol: {{ .protocol }}, port: {{ .port }}, targetPort: {{ .targetPort }} }
{{- end }}

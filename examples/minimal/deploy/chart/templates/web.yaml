apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.stowage.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}                  # the pull account `notes-stow k8s` records
      {{- end }}
      {{- with .Values.stowage.sysctls }}
      securityContext:
        sysctls:   # the network settings `notes-stow k8s install --unsafe-sysctls` gives
          {{- toYaml . | nindent 10 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "notes.image" (dict "root" $ "key" "web") }}
          {{- with .Values.stowage.secret }}
          envFrom:
            - secretRef: { name: {{ . }} }   # the secrets and inputs `notes-stow k8s` records
          {{- end }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          volumeMounts:
            - { name: uploads, mountPath: /data }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-uploads }   # `k8s reset-db` deletes it
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: 80
      targetPort: 8080

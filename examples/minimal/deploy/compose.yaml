# The single service definition of the notes stack. Images come only through
# ${STOWAGE_IMAGE_<KEY>}; the TLS front is added by Stowage.
services:
  postgres:
    image: ${STOWAGE_IMAGE_POSTGRES}
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    image: ${STOWAGE_IMAGE_API}
    environment:
      DATABASE_URL: postgres://notes:${POSTGRES_PASSWORD}@postgres:5432/notes
      SESSION_SECRET: ${SESSION_SECRET}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      PUBLIC_URL: ${STOWAGE_URL_APP}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # Serving once its schema is migrated: the install waits for it (readiness, /healthz/ready, is
    # the health gate's, through the spec's health provider).
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  web:
    image: ${STOWAGE_IMAGE_WEB}
    environment:
      API_URL: ${STOWAGE_URL_API}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      retries: 30
    restart: unless-stopped

volumes:
  postgres: {}
  uploads: {}

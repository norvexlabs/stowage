# The api: it migrates the database at start (under a lock, so replicas never race), then serves
# as the app role. Embedded: both URLs point at the release's postgres, with the generated
# passwords; external: DATABASE_URL and APP_DATABASE_URL come from the Secret as given (the api
# refuses to start when either is empty).
{{- $c := dict "root" $ "component" "api" "port" 9090 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "atlas.labels" $c | nindent 4 }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "atlas.labels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "atlas.labels" $c | nindent 8 }}
    spec:
      {{- include "atlas.pod" . | trim | nindent 6 }}
      # The api calls no Kubernetes API: no ServiceAccount token, whose mount would go below its
      # read-only /run/secrets (/var/run is /run), where the kubelet could not make it.
      automountServiceAccountToken: false
      containers:
        - name: api
          image: {{ include "atlas.image" (dict "root" $ "key" "api") }}
          env:
            {{- include "atlas.secretEnv" (dict "root" $ "keys" (list "SESSION_SECRET" "INTERNAL_SERVICE_SECRET" "INTERNAL_SERVICE_SECRET_NEXT" "INTERNAL_SERVICE_SECRET_PREVIOUS" "ORG_NAME" "SEARCH_URL" "SEARCH_KEY") "optional" (list "SEARCH_URL" "SEARCH_KEY")) | trim | nindent 12 }}
            {{- if eq .Values.postgres.mode "embedded" }}
            {{- include "atlas.secretEnv" (dict "root" $ "keys" (list "POSTGRES_PASSWORD" "APP_DB_PASSWORD")) | trim | nindent 12 }}
            - name: DATABASE_URL
              value: postgres://atlas:$(POSTGRES_PASSWORD)@{{ .Release.Name }}-postgres:5432/atlas
            - name: APP_DATABASE_URL
              value: postgres://atlas_app:$(APP_DB_PASSWORD)@{{ .Release.Name }}-postgres:5432/atlas
            {{- else if eq .Values.postgres.mode "external" }}
            {{- include "atlas.secretEnv" (dict "root" $ "keys" (list "DATABASE_URL" "APP_DATABASE_URL")) | trim | nindent 12 }}
            {{- else }}
            {{- fail (printf "postgres.mode %q: embedded or external" .Values.postgres.mode) }}
            {{- end }}
            - name: ENCRYPTION_KEY_FILE      # as_file: the value is in no variable
              value: /run/secrets/encryption_key
            - name: UPSTREAM_API_KEY_FILE
              value: /run/secrets/upstream_api_key
          volumeMounts:
            - { name: upstream-ca, mountPath: /etc/atlas/upstream-ca.pem, subPath: API_CA_BUNDLE, readOnly: true }
            - { name: secret-files, mountPath: /run/secrets, readOnly: true }
          ports:
            - containerPort: 9090
          startupProbe:          # the migrations run before the api listens
            httpGet: { path: /health, port: 9090 }
            periodSeconds: 2
            failureThreshold: 300   # 600 s: the api's wait for the database, then its migrations
          livenessProbe:
            httpGet: { path: /health, port: 9090 }
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /ready, port: 9090 }   # a psql round trip
            periodSeconds: 2
            timeoutSeconds: 5
      volumes:
        - name: upstream-ca   # the file input API_CA_BUNDLE, empty while it is
          secret:
            secretName: {{ required "stowage.files: install the chart with at-stow k8s, which records the Secret" .Values.stowage.files | quote }}
        - name: secret-files  # the secrets delivered as files (as_file), each under its key
          secret:
            secretName: {{ required "stowage.secretFiles: install the chart with at-stow k8s, which records the Secret" .Values.stowage.secretFiles | quote }}
            items:
              - { key: ENCRYPTION_KEY, path: encryption_key }
              - { key: UPSTREAM_API_KEY, path: upstream_api_key }
---
{{ include "atlas.service" $c }}

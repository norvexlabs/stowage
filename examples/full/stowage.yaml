# A full Stowage project: every spec key in use. "atlas" is a fictional stack — an API, an ingest
# service and a console behind the front, an optional search extension, CalVer releases.
apiVersion: stowage/v1
name: atlas
short_name: at               # the installer at-stow: short_name differs from name

stowage:
  requires: ">=0.1 <1"            # exact runtime pinned in stowage.lock

version:
  source: { provider: changelog, file: CHANGELOG.md }        # first "## [x]" heading
  scheme: { provider: calver, format: YYYY.M.MICRO, month_guard: utc }
changelog: { provider: keepachangelog, file: CHANGELOG.md }
channels:
  stable: { tag: "v{v}", mutable: false, latest: true }       # moves installer :latest
  dev:    { tag: "v{v}-dev", mutable: true }

registry:
  prefix: registry.example.com/atlas
  pull: { provider: token, user: atlas-pull, token_env: STOWAGE_PULL_TOKEN }     # baked into installs
  push: { provider: token, user: publisher, token_env: STOWAGE_PUSH_TOKEN }     # publisher only

signing:
  provider: cosign-key
  key: env://ATLAS_SIGNING_KEY
  public_keys: [keys/release-2026.pub]

images:
  api:
    context: .
    dockerfile: docker/api.Dockerfile
    target: runtime
    args: { FEATURES: "core,ingest" }
    add_hosts: { packages.atlas.test: [192.0.2.10, 192.0.2.11] }  # a name the build's steps resolve, to each address
    network: default
    inputs: [server/, migrations/]
  ingest:    { context: ., dockerfile: docker/ingest.Dockerfile, inputs: [server/] }
  ui:        { context: ui, dockerfile: ui/Dockerfile }
  provision: { context: provision, dockerfile: provision/Dockerfile }
  postgres:  { ref: "postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24" }

stack:
  compose: deploy/compose.yaml

services:                                                      # what a compose service asks of the host, beyond its compose file
  postgres: { memory: { percent: 25, max: 16G } }              # percent of the host's RAM, recomputed at each start, capped at 16 GiB
  api: { memory: 10, update: start-first, update_signal: SIGUSR2, update_socket: /run/atlas/handoff, update_ready: ready, update_decline_status: 75 }  # its new container healthy beside the old before the old stops; the old one told to go once the new one wrote ready; exit 75 asks for stop-first
  echo: { cpus: 1, irq: on }                                   # a whole core of its own, the NICs' interrupts on it too
  ingest: { nftables: deploy/ingest.nft }                      # its own nftables table, loaded on the VM
  relay: { interface: edge, address_input: RELAY_ADDRESS }     # an address of its own on the edge NIC (an ipvlan network)
  vpn: { host_network: true, nftables: deploy/vpn.nft, transparent: [vpn0], front_hosts: host-gateway }   # on the host's network; its table steers vpn0's traffic to its own sockets; the front's domains at Docker's host-gateway address

tune:
  profile: network   # a heavy network load: the hosts are tuned for it (default: Docker's path alone)

host:                                                          # written into the OS bundle; tune reports it as advice on another host
  modules:                                                     # modprobe's files; tune reports what differs
    tcp_diag: { load: true, reason: "ss -ti reads the TCP sockets' details" }
    pcspkr: { block: true, reason: a VM has no speaker }
    overlay: { options: { redirect_always_follow: "Y" }, reason: "Docker's storage: the kernel's default, stated" }
  packages:                                                    # installed after the OS bundle's own
    tcpdump: { reason: "capture on the VM's interfaces" }
  firmware:                                                    # under /lib/firmware: the build fails without it
    intel/ice/ddp/ice.pkg: { reason: "the E810's DDP package: without it ice runs in safe mode, one queue a port" }
  interfaces:                                                  # by role, the interface's name; vm create gives each its NIC
    uplink: { primary: true, reason: "the default route: the clients of the front, the registry, SSH" }
    edge:                                                      # the probes' side, whose marked packets are delivered here
      mtu: 1500
      routing_policy_rules: [{ FirewallMark: "0x1", Table: "100" }]
      routes: [{ Type: local, Destination: 0.0.0.0/0, Table: "100" }]
      ethtool: { channels: { combined: max }, features: { rx-gro-list: "off" } }   # over the tune profile's
      reason: "the probes' network, which the UDP echo answers on alone"
    vpn0: { kind: tun, routes: [{ Destination: 10.99.0.0/24 }], forward: [uplink], reason: "the vpn service's peers, whose traffic the host forwards out of the uplink" }
  kernel_args:                                                 # the OS bundle's boot; tune reports what differs
    iommu: { value: pt, reason: "the NICs' DMA passed through, not translated" }
  sysctls:                                                     # beyond the tune profile's, written at each boot
    vm.swappiness: { value: "10", reason: "postgres's pages stay in RAM" }
  power: performance                                           # the CPUs at their full speed (n/a on a VM: the hypervisor's)

front:
  tls_modes: [acme, dns-cloudflare, byo, internal, none]
  interface: uplink                                            # the VM's firewall opens the front's ports there alone
  routes:
    - name: console
      domain_input: CONSOLE_DOMAIN
      upstream: ui:8080
      strip_headers: [X-Auth-Request-*, X-Atlas-Tenant]
    - name: api
      domain_input: API_DOMAIN
      upstream: api:9090
      strip_headers: [X-Auth-Request-*, X-Atlas-Tenant]
      # Off while AUTH_ADDRESS is empty; the answer's user header reaches the api.
      forward_auth: { address_input: AUTH_ADDRESS, uri_input: AUTH_URI, copy_headers: [X-Auth-Request-User] }
    - name: ingest
      domain_input: INGEST_DOMAIN
      upstream: ingest:8080
      allow_input: INGEST_SOURCES                              # the senders' CIDRs
    - name: ops
      domain_input: OPS_DOMAIN
      upstream: api:9090
      client_auth: true                                        # a certificate the install's --client-ca issued
      basic_auth: { user: ops, secret: OPS_PASSWORD }          # then a login (bcrypt in the front's configuration)
    - name: status
      domain_input: CONSOLE_DOMAIN                             # the console's domain, under its own path
      path: /api/v1/status                                     # kept in the request the api gets
      upstream: api:9090
  portal: console
  loopback_ports: { console: 3000, api: 9090, ingest: 8080, ops: 9091, status: 9092 }
  loopback_env: { COOKIE_SECURE: "false", TRUSTED_PROXY_HOPS: "0" }
  publish_ca: { volume: ca }                                    # the internal CA, or byo's --ca
  http_port: 80                                                 # the defaults; an install's --http-port
  https_port: 443                                               # and --https-port move them

# Host ports published to a service as they are, beside the front.
l4:
  routes:
    - { name: echo,     protocol: tcp, port: 17007, upstream: echo:17007, address_input: ECHO_ADDRESS, bind_input: ECHO_BIND }
    - { name: echo-udp, protocol: udp, port: 17007, upstream: echo:17007, allow_input: ECHO_SOURCES, interface: edge }   # the VM's firewall

health:
  provider: http-json
  service: api
  port: 9090
  path: /ready
  expect: { status: ready }
  liveness_path: /health

database:
  engine: postgres
  service: postgres
  name: atlas
  roles: { migrate: atlas, app: atlas_app }                   # two-URL contract
  schema_compat:
    provider: sql
    current: "SELECT max(version) FROM schema_migrations WHERE success"
    barrier_after: >-
      SELECT string_agg(description, '; ' ORDER BY version) FROM schema_migrations
      WHERE version > $1 AND description LIKE 'rollback barrier%'
    reads_newer_label: com.example.atlas.reads-newer-schema   # "true" on an image that reads a newer schema
    reads_newer_image: api                                    # the image that carries it
    baseline: 1

data:
  volumes:
    postgres: { uid: 70 }
    spool:    { uid: 65532 }
    certs:    { uid: 0, keep_on_reset: true }
  reset: [postgres, spool]

secrets:
  - { key: ENCRYPTION_KEY,          gen: hex32 }
  - { key: SESSION_SECRET,          gen: hex32 }
  - { key: INTERNAL_SERVICE_SECRET, gen: hex32, rotation: true }   # secrets rotate
  - { key: POSTGRES_PASSWORD,       gen: pass18 }
  - { key: APP_DB_PASSWORD,         gen: pass18 }
  - { key: OPS_PASSWORD,            gen: pass18 }   # the ops route's login

safe_defaults:
  COOKIE_SECURE: "true"
  TRUSTED_PROXY_HOPS: "1"

inputs:
  - { key: SUPPORT_EMAIL,     prompt: "Support address shown on the public site", when: tls, shapes: [docker, kairos] }
  - { key: ADMIN_EMAIL,       prompt: "Administrator email",      required: true }
  - { key: ORG_NAME,          prompt: "Organisation name",        required: true }
  - { key: UPSTREAM_API_KEY,  prompt: "Upstream API key",         secret: true, optional: true }
  - { key: SEARCH_URL,        prompt: "Search service URL (empty: no search)", optional: true }
  - { key: SEARCH_KEY,        prompt: "Search service key",       secret: true, optional: true }
  - { key: INGEST_SOURCES,    prompt: "Addresses allowed to send events (CIDRs; empty refuses everyone)", default: "0.0.0.0/0, ::/0", shapes: [docker, kairos] }
  - { key: AUTH_ADDRESS,      prompt: "Authentication service of the api route, host:port", advanced: true, shapes: [docker, kairos] }
  - { key: AUTH_URI,          prompt: "Path the authentication service is asked at", advanced: true, shapes: [docker, kairos] }
  - { key: LOG_LEVEL,         prompt: "Log level (debug, info, warning)", advanced: true }
  - { key: ECHO_ADDRESS,      prompt: "Host name or address clients dial the echo service at", default: localhost, shapes: [docker, kairos] }
  - { key: ECHO_BIND,         prompt: "Host address the TCP echo is published on (every address when empty)", advanced: true, shapes: [docker, kairos] }
  - { key: ECHO_SOURCES,      prompt: "Sources (addresses, CIDRs) the VM lets reach the UDP echo", default: "0.0.0.0/0 ::/0", shapes: [kairos] }
  - { key: RELAY_SOURCE,      prompt: "Event source the relay forwards (empty: no relay)", optional: true, profile: relay, shapes: [docker, kairos] }
  - { key: RELAY_ADDRESS,     prompt: "Address the relay has of its own on the edge network (empty: none)", optional: true, advanced: true, shapes: [docker, kairos] }
  # Kubernetes: the database is external or embedded by the chart's postgres.mode value
  # (embedded: these two URLs are left empty).
  - { key: DATABASE_URL,      prompt: "Migration database URL (external Postgres)", secret: true, optional: true, shapes: [kubernetes] }
  - { key: APP_DATABASE_URL,  prompt: "Application database URL (external Postgres)", secret: true, optional: true, shapes: [kubernetes] }
  - { key: ADMIN_PASSWORD,    prompt: "Administrator password",   secret: true, required: true, shapes: [kubernetes] }

hooks:
  provision:
    provider: container
    image: provision
    cmd: [provision.py]
    env: [ADMIN_EMAIL, ADMIN_PASSWORD, INTERNAL_SERVICE_SECRET]   # all it receives, with what it returned before
    returns: [ADMIN_API_KEY, ADMIN_LOGIN]                       # provision --set gives one it has not returned
    outputs: credentials.txt
  maintenance:
    disk_pressure:
      soft_pct: 75
      hard_pct: 90
      post: http://api:9090/api/v1/maintenance/purge
      auth_secret: INTERNAL_SERVICE_SECRET

# Search is an app of its own, published beside atlas: an install takes its URL (and its key).
extensions:
  - { name: atlas-search, input: SEARCH_URL, key_input: SEARCH_KEY, prompt: "Full-text search over the events" }

# When another project uses atlas as an extension, the api route is the endpoint it is given.
endpoint: api

backup:
  provider: pg-age-rclone
  default_profile: full
  profiles:
    full: all
    config: [organisations, users, api_keys, settings]
    lean: { exclude: [events, "audit_*"] }
  volumes: [spool]                                           # archived beside each dump

shapes:
  docker: {}
  kubernetes:
    chart: deploy/chart
    postgres_modes: [embedded, external]
    schema: { url_env: DATABASE_URL, image: postgres }            # k8s upgrade records the schema, k8s rollback checks it
  kairos:
    base: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    kairos_init: quay.io/kairos/kairos-init:v4.4.0-rc2@sha256:ac885c9f3002a3f0e7000947e3d1e2a5c95f5e2d0212d5f9bbd663347f1ebe0c
    disk_formats: [raw, qcow2, ova, vhd, gce, iso]
    cloud_publish: [aws, azure, gcp]
    disks: opt-in   # always: every ship publishes the disks; opt-in (the default): a ship asked to (--disks)
    health_gate: { deadline_s: 600, deadline_after_reset_s: 1800, poll_s: 30 }
    host_api: [api]
    size: { min: { cpus: 2, memory: 2G, disk: 20G }, recommended: { cpus: 4, memory: 8G, disk: 40G } }   # vm create's least and default size

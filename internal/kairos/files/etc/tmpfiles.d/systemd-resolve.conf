# The host's resolver file, in place of systemd-resolved's own rule of the same name: a link to
# its list of the upstream servers (the seed's DNS), made at every boot. Its rule makes the link
# only where there is no file, and the image has one: the empty file a container build leaves,
# which /etc's overlay brings back at each boot. The non-stub list, so a host-network container,
# which Docker gives a copy of it, reaches the servers too.
L+ /etc/resolv.conf - - - - ../run/systemd/resolve/resolv.conf

#!/usr/sbin/nft -f
# {{.Name}}'s host firewall: inbound traffic is dropped but for the loopback, replies, ICMP, DHCP
# replies, SSH (/etc/nftables.d/ssh.nft: open to all, or the sources `vm create --ssh-allow` gave
# the cloud-config) and the install's ports (/run/nftables.d/{{.Name}}-ports.nft, which every start
# of the install writes). The stack's published ports reach their containers through Docker's own
# chains, which this file leaves alone: it flushes its table only, never the ruleset, so a reload
# (`nft -f /etc/nftables.conf`) keeps Docker's. Its forward chain, ahead of Docker's, judges what
# the VM routes for others, IPv4 and IPv6 alike, whatever Docker's own FORWARD policies are: the
# stack's bridges' traffic (Docker's by their names: docker0, br-*, and the names the stack's
# compose networks give theirs, in the file below) is left to Docker's chains, a reply passes, and what is forwarded
# between the host's own interfaces passes only as a host.interfaces role's `forward` pair
# (/run/nftables.d/forward/{{.Name}}-forward.nft, which every start of the install writes) — any
# other is dropped, a boot's before the install's start included.
add table inet {{.Name}}
flush table inet {{.Name}}

table inet {{.Name}} {
	chain input {
		type filter hook input priority 0; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		ip protocol icmp accept
		# ICMPv6 behind an extension header too (MLD queries carry Hop-by-Hop options).
		meta l4proto ipv6-icmp accept
		# A DHCP server's answer to a broadcast is no reply conntrack knows.
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		include "/etc/nftables.d/*.nft"
		include "/run/nftables.d/*.nft"
	}
	# The front's ports held to its roles (/usr/local/{{.Name}}/nftables.d/{{.Name}}-front.hold,
	# which every start writes while the front is held): a chain of its own ahead of the forward
	# chain, whose drop is final whatever any later chain accepts.
	chain hold {
		type filter hook forward priority filter - 2; policy accept;
		include "/usr/local/{{.Name}}/nftables.d/*.hold"
	}
	chain forward {
		type filter hook forward priority filter - 1; policy accept;
		include "/usr/local/{{.Name}}/nftables.d/*.nft"
		ct state established,related accept
		iifname "docker0" accept
		iifname "br-*" accept
		oifname "docker0" accept
		oifname "br-*" accept
		include "/run/nftables.d/forward/*.nft"
		counter drop
	}
}

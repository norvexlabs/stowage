# {{.Name}}: the initrd's network stays the initrd's. Kairos's initrd runs dracut's default
# network (zzzz-dracut-default.network: every NIC, DHCP and router advertisements); its networkd
# drops what it set as it stops at switch-root, where it would keep it by default (dynamic-on-stop).
# The system's networkd then starts each NIC from its own files alone: a NIC without IPv6 (a
# secondary, a primary with IPv6 off) keeps no address or route the initrd learnt.
[Network]
KeepConfiguration=no

# {{.Name}}'s kernel modules (shapes.kairos.modules): those blocked, and their options. In the image's
# /usr, not /etc, which Kairos keeps across upgrades and rollbacks.
{{- range $name, $m := .Modules}}{{if $m.Block}}
# {{$m.Reason}}
blacklist {{$name}}
install {{$name}} /bin/false
{{- end}}{{if $m.Options}}
# {{$m.Reason}}
options {{$name}}{{range $k, $v := $m.Options}} {{$k}}={{$v}}{{end}}
{{- end}}{{end}}
